name = "motivaition-coach"
main = "backend/worker.ts"
compatibility_date = "2026-08-13"

[[durable_objects.bindings]]
name = "COACH_COORDINATOR"
class_name = "CoachCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CoachCoordinator"]

[vars]
PROMPT_VERSION = "m3-v1"
COACH_MODEL = "gpt-5.6-terra"
COACH_REASONING_EFFORT = "low"
MAX_REQUESTS_PER_DAY = "20"
MAX_TOKENS_PER_DAY = "20000"
MAX_CHAT_REQUESTS_PER_DAY = "30"
MAX_CHAT_TOKENS_PER_DAY = "200000"
